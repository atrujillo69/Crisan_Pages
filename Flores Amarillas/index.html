<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0708">
<meta name="description" content="Un pequeño detalle de flores amarillas, tulipanes y lirios.">
<title>Para mi doctora favorita</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --oro: #F2C24B;
    --crema: #FFF1CC;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: var(--serif);
    color: var(--crema);
    background:
      radial-gradient(ellipse 80% 70% at 50% 52%, #2b1c0c 0%, #140d09 48%, #08060a 100%);
    background-color: #08060a;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  #galaxia {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  #galaxia:active { cursor: grabbing; }

  /* ── Pantalla de inicio ── */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(43, 28, 12, .55), rgba(6, 4, 8, .92) 78%);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    transition: opacity 1.6s ease, visibility 0s 1.6s;
  }
  #intro.fuera { opacity: 0; visibility: hidden; pointer-events: none; }

  .intro-flor {
    width: clamp(140px, 34vw, 200px);
    margin-bottom: .2rem;
    filter: drop-shadow(0 0 24px rgba(255, 200, 60, .42));
    transition: transform 1.6s ease;
    animation: brotar 2.8s cubic-bezier(.2, .9, .3, 1.08) backwards;
  }
  #intro.fuera .intro-flor { transform: scale(1.7); }
  .intro-flor svg { display: block; width: 100%; height: auto; transform-origin: 50% 85%; animation: mecerTulipan 6s ease-in-out infinite alternate; }
  @keyframes brotar { from { transform: scale(.05) translateY(50px); opacity: 0; } 40% { opacity: 1; } }
  @keyframes mecerTulipan { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

  .subir { animation: subir 1.6s ease-out var(--r, 0s) backwards; }
  @keyframes subir { from { opacity: 0; transform: translateY(14px); } }

  .fecha {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--oro);
    opacity: .85;
  }

  #intro h1 {
    margin: .7rem 0 .6rem;
    max-width: 14ch;
    font-size: clamp(2.5rem, 9vw, 4.6rem);
    font-weight: 600;
    font-style: italic;
    line-height: 1.05;
    text-wrap: balance;
    background: linear-gradient(180deg, #FFF6D2 10%, #F2C24B 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 18px rgba(242, 194, 75, .25));
  }

  .sub {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-style: italic;
    opacity: .75;
  }

  #abrir {
    margin-top: 2.2rem;
    padding: .8rem 2.4rem;
    border: 1px solid rgba(242, 194, 75, .55);
    border-radius: 999px;
    background: rgba(242, 194, 75, .06);
    color: var(--crema);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .3s, box-shadow .3s, transform .3s;
  }
  #abrir:hover, #abrir:focus-visible {
    outline: none;
    background: rgba(242, 194, 75, .16);
    box-shadow: 0 0 28px rgba(242, 194, 75, .35);
    transform: translateY(-1px);
  }

  /* ── Sobre la galaxia ── */
  .titulo {
    position: fixed;
    top: clamp(.9rem, 3vh, 1.6rem);
    left: 0; right: 0;
    z-index: 5;
    text-align: center;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    font-style: italic;
    letter-spacing: .04em;
    color: rgba(255, 241, 204, .72);
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease 1.2s;
  }
  body.abierto .titulo { opacity: 1; }

  .tarjeta {
    position: fixed;
    left: 50%;
    bottom: clamp(3.6rem, 10vh, 6rem);
    z-index: 6;
    width: min(34rem, 90vw);
    padding: clamp(1rem, 2.6vw, 1.5rem) clamp(1.2rem, 3.4vw, 2rem);
    text-align: center;
    border-radius: 24px;
    background: rgba(26, 18, 11, .66);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(242, 194, 75, .25);
    box-shadow: 0 12px 44px rgba(0, 0, 0, .5);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 14px);
    transition: opacity .5s ease, transform .5s ease, visibility 0s .5s;
    pointer-events: none;
  }
  .tarjeta.visible { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }

  .contenido { transition: opacity .28s ease, transform .28s ease; }
  .contenido.oculto { opacity: 0; transform: translateY(6px); }

  .etiqueta {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--oro);
    margin-bottom: .55rem;
  }

  .frase {
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.25rem, 3.3vw, 1.8rem);
    line-height: 1.32;
  }
  .frase.larga {
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    line-height: 1.4;
    white-space: pre-line;
  }
  .tarjeta.carta { width: min(40rem, 92vw); max-height: calc(100vh - 7rem); max-height: calc(100dvh - 7rem); overflow: auto; }

  .contador {
    position: fixed;
    top: calc(clamp(.9rem, 3vh, 1.6rem) + 2rem);
    left: 0; right: 0;
    z-index: 5;
    text-align: center;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: .66rem;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(242, 194, 75, .7);
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease 1.6s;
  }
  body.abierto .contador { opacity: 1; }

  .musica {
    position: fixed;
    top: clamp(.7rem, 2.5vh, 1.2rem);
    right: clamp(.7rem, 2.5vw, 1.2rem);
    z-index: 8;
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border: 1px solid rgba(242, 194, 75, .35);
    border-radius: 50%;
    background: rgba(26, 18, 11, .55);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--crema);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease 1.2s, background .3s, box-shadow .3s;
  }
  /* reproductor de YouTube: solo se usa su sonido, así que no se ve */
  #ytwrap { position: fixed; left: 0; bottom: 0; width: 200px; height: 200px; opacity: .01; pointer-events: none; z-index: -1; overflow: hidden; }
  .musica[hidden] { display: none; }
  body.abierto .musica { opacity: 1; pointer-events: auto; }
  .musica:hover, .musica:focus-visible { outline: none; background: rgba(242, 194, 75, .16); box-shadow: 0 0 18px rgba(242, 194, 75, .3); }
  .musica svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .musica .tacha { display: none; }
  .musica.silencio .tacha { display: block; }
  .musica.silencio .ondas { display: none; }

  .pista {
    position: fixed;
    left: 0; right: 0;
    bottom: max(1rem, env(safe-area-inset-bottom));
    z-index: 5;
    padding: 0 1rem;
    text-align: center;
    font-size: clamp(.95rem, 2.4vw, 1.1rem);
    font-style: italic;
    color: rgba(255, 241, 204, .55);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .pista.visible { opacity: 1; }

  @media (max-height: 520px) {
    .pista { display: none; }
    .titulo, .contador { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .intro-flor, .intro-flor svg, .subir { animation: none; }
    .contenido, .tarjeta, #intro { transition-duration: .01s; }
  }
</style>
</head>
<body>

<canvas id="galaxia" role="img" aria-label="Galaxia de flores amarillas, tulipanes y lirios que gira lentamente"></canvas>

<div id="intro">
  <div class="intro-flor" id="introFlor" aria-hidden="true"></div>
  <p class="fecha subir" id="fecha" style="--r:.9s"></p>
  <h1 class="subir" id="tituloIntro" style="--r:1.5s"></h1>
  <p class="sub subir" id="subtitulo" style="--r:2.3s"></p>
  <button id="abrir" class="subir" style="--r:3.1s" type="button">Abrir</button>
</div>

<p class="titulo" id="titulo"></p>
<p class="contador" id="contador"></p>

<div id="ytwrap" aria-hidden="true"><div id="ytplayer"></div></div>

<button class="musica" id="musica" type="button" hidden aria-label="Silenciar o reanudar la música" aria-pressed="true">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z"/>
    <g class="ondas"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g>
    <path class="tacha" d="M17 9l5 6M22 9l-5 6"/>
  </svg>
</button>

<div class="tarjeta" id="tarjeta" role="status" aria-live="polite">
  <div class="contenido" id="contenido">
    <p class="etiqueta" id="etiqueta"></p>
    <p class="frase" id="frase"></p>
  </div>
</div>

<p class="pista" id="pista"></p>

<script>
(() => {
  'use strict';

  /* ═════════════ PERSONALIZAR ═════════════ */
  const TITULO    = 'Para mi doctora favorita';
  const FECHA     = '21 de septiembre';
  const SUBTITULO = 'Preparé algo pequeño para usted';

  // Carta que se abre al tocar la flor del centro (\n\n separa párrafos)
  const CARTA =
    'Hoy quiero darle flores de una manera un poco diferente, más a mi manera. ' +
    'Quise relacionarlo con algo que forma parte de mi día a día y convertirlo en un detalle especial para usted.\n\n' +
    'Lo hice con mucho cariño, pensando en usted en cada detalle, y espero de corazón que le guste tanto como a mí me gustó prepararlo.\n\n' +
    'La quiero mucho.';

  // Una sola flor del jardín lleva este mensaje (se escoge al azar cada vez)
  const ESPECIAL = {
    etiqueta: 'Flor especial',
    texto: 'Esta flor también es para la más funada y más salada de la rotación.',
  };

  // Canción de fondo. Use UNA de las dos opciones (si pone las dos, gana YouTube):
  //  · YouTube: el código del video, lo que va después de "v=" en su enlace. No necesita ningún archivo.
  //  · Archivo: audio junto a este index.html (mp3, m4a, ogg o wav). Ejemplo: 'musica.m4a'.
  // Si no hay nada o falla, simplemente no aparece el botón de música.
  const MUSICA_YOUTUBE = 'yWkQbrfSvfs';   // Juanes - Para Tu Amor (video oficial)
  const MUSICA = '';

  // Palabras que giran alrededor
  const PALABRAS = [
    'Mi doctora favorita', 'Gracias', 'Luz', 'Calidez', 'Sonrisa', 'Ternura', 'Alegría',
    'Carisma', 'Risas', 'Ingenio', 'Crack', 'Encanto', 'Cariño', 'Brillo', 'Primavera',
  ];

  // Mensajes: cada uno va en una flor distinta (más la flor especial de arriba).
  // Puede agregar o quitar líneas y la cantidad de flores se ajusta sola.
  const MENSAJES = [
    'Solo quería recordarle que me encanta verla sonreír.',
    'Espero que hoy tenga un bonito día, al igual que usted.',
    'No sé cómo lo hace, pero siempre consigue mejorarme el día.',
    'Su sonrisa es de esas cosas que podría ver mil veces y no cansarme.',
    'Podría escucharla hablar de cualquier cosa y aun así quedarme con ganas de seguir escuchándola.',
    'Me encanta lo inteligente que es y que siempre tenga algo nuevo que enseñarme.',
    'Tiene una forma de ser que me gusta cada día un poquito más.',
    'A veces basta con verla para que mi día cambie por completo.',
    'Quiero que nunca dude de lo especial que es para mí.',
    'Me encanta verla emocionarse cada vez que le doy flores.',
    'Me gusta mucho la forma en la que usted es.',
    'Es hermosa, pero mientras más la conozco, más cosas encuentro que me gustan de usted.',
    'No sé si se lo digo lo suficiente, pero admiro muchísimo lo inteligente que es.',
    'Sus ojos tienen algo que hace que me pierda completamente cuando la miro.',
    'A veces me quedo viéndola y se me olvida hasta lo que le iba a decir.',
    'Me encanta escuchar sus anécdotas, especialmente de las cosas tan random que le pasan.',
    'Entre su forma de ser, su inteligencia y lo hermosa que es, cada día me gusta un poquito más.',
    'Me encanta que con usted puedo hablar de cualquier cosa y siempre termino queriendo seguir la conversación.',
    'Hay muchas cosas que me gustan de usted, pero su mirada definitivamente tiene algo especial.',
    'Mientras más la conozco, más entiendo por qué me enamoré de usted.',
    'Si alguna vez me quedo callado mientras la miro, probablemente solo estoy pensando en lo bonita que es.',
    'No sé si se lo digo seguido, pero amo escucharla.',
    'Me gusta poder compartir hasta los momentos más simples con usted.',
    'Usted se ha convertido en una parte muy bonita de mis días.',
    'Una de las cosas que más admiro de usted es lo entregada que es con sus pacientes y el cuidado que pone en cada cosa que hace.',
    'Hay momentos en los que solo quiero quedarme viéndola y ya.',
    'Me gusta saber que además de lo hermosa que es, también es una mujer que admiro muchísimo.',
    'Quiero seguir conociendo cada una de esas pequeñas cosas que la hacen ser usted.',
    'No necesito una ocasión especial para querer tener un detalle con usted.',
    'Espero que estas flores le recuerden aunque sea un poquito lo importante que es para mí.',
    'Me gusta la tranquilidad que siento cuando estoy con usted.',
    'Cada momento con usted, por simple que sea, termina siendo especial para mí.',
    'Quiero que sepa que me siento muy orgulloso de usted y de todo lo que ha logrado.',
    'Conmigo siempre va a tener a alguien que la apoye, incluso en esos días en los que usted misma dude de lo que puede hacer.',
    'Quiero ser esa persona que se alegre de verdad por cada uno de sus logros, desde los más pequeños hasta los que todavía le faltan por cumplir.',
  ];

  // Nombre que aparece sobre el mensaje según la flor
  const NOMBRES = { tulipan: 'Tulipán', lirio: 'Lirio' };
  /* ═════════════ FIN DE PERSONALIZAR ═════════════ */

  const REDUCIR = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const elegir = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const barajar = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  document.title = TITULO;
  $('#fecha').textContent = FECHA;
  $('#tituloIntro').textContent = TITULO;
  $('#subtitulo').textContent = SUBTITULO;
  $('#titulo').textContent = TITULO;

  /* ───────────── Colores: [base, medio, punta] ───────────── */
  const PALETAS = {
    sol:     ['#F4A300', '#FFCB2E', '#FFE066'],
    durazno: ['#EE6A2C', '#FF9A57', '#FFCBA0'],
    rosa:    ['#E8608C', '#FF8FB0', '#FFC2D6'],
    dorado:  ['#F08A00', '#FFC93A', '#FFF0A0'],
    crema:   ['#F2B44A', '#FFEFC2', '#FFFFFF'],
  };

  // Oscurece hacia un naranja tostado (no hacia negro, que ensucia el amarillo)
  const TOSTADO = [0xB8, 0x50, 0x08];
  const oscurecer = (hex, k = 0.2) =>
    '#' + hex.slice(1).match(/../g)
      .map((c, i) => Math.round(parseInt(c, 16) * (1 - k) + TOSTADO[i] * k).toString(16).padStart(2, '0'))
      .join('');

  /* ───────────── Flores en SVG ───────────── */
  const degradados = (pal) => {
    const [a, b, c] = PALETAS[pal];
    let s = '';
    for (const [suf, f] of [['', (x) => x], ['-d', oscurecer]]) {
      s += `<linearGradient id="g-${pal}${suf}" x1="0" y1="1" x2="0" y2="0">` +
           `<stop offset="0" stop-color="${f(a)}"/><stop offset=".55" stop-color="${f(b)}"/>` +
           `<stop offset="1" stop-color="${f(c)}"/></linearGradient>`;
    }
    return s;
  };

  const CABEZAS = {
    // Tulipán, de lado: tres pétalos formando la copa
    tulipan(p) {
      const g = `url(#g-${p})`, gd = `url(#g-${p}-d)`;
      return `<g transform="translate(100 100) scale(1.3) translate(-100 -100)">` +
             `<path d="M100 141 C 64 140, 56 100, 62 54 C 84 68, 99 100, 100 141Z" fill="${gd}"/>` +
             `<path d="M100 141 C 136 140, 144 100, 138 54 C 116 68, 101 100, 100 141Z" fill="${gd}"/>` +
             `<path d="M100 144 C 70 142, 68 96, 100 46 C 132 96, 130 142, 100 144Z" fill="${g}" stroke="rgba(120,60,10,.14)" stroke-width=".8"/>` +
             `<path d="M99 62 C 88 90, 86 118, 95 136" stroke="rgba(255,255,255,.5)" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
    },

    // Lirio: seis pétalos puntiagudos, pistilo y estambres
    lirio(p) {
      const g = `url(#g-${p})`, gd = `url(#g-${p}-d)`;
      const petalo = 'M100 100 C 82 80, 80 46, 100 16 C 120 46, 118 80, 100 100Z';
      let s = '';
      for (const [a, f] of [[0, gd], [120, gd], [240, gd], [60, g], [180, g], [300, g]]) {
        s += `<g transform="rotate(${a} 100 100)"><path d="${petalo}" fill="${f}" stroke="rgba(120,60,10,.2)" stroke-width=".8"/>` +
             `<path d="M100 94 L100 32" stroke="rgba(150,70,0,.25)" stroke-width="1.2" fill="none"/>` +
             `<circle cx="95" cy="74" r="1.6" fill="rgba(160,70,10,.35)"/>` +
             `<circle cx="104" cy="62" r="1.6" fill="rgba(160,70,10,.35)"/>` +
             `<circle cx="97" cy="50" r="1.4" fill="rgba(160,70,10,.3)"/></g>`;
      }
      s += `<circle cx="100" cy="100" r="9" fill="#C9D65A" opacity=".85"/>`;
      for (let k = 0; k < 6; k++) {
        const a = (15 + k * 60) * Math.PI / 180, L = 30 + (k % 2) * 6;
        const ex = 100 + L * Math.sin(a), ey = 100 - L * Math.cos(a);
        s += `<line x1="100" y1="100" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#D9902B" stroke-width="1.6" stroke-linecap="round"/>` +
             `<ellipse cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" rx="2.6" ry="6" fill="#A5471A" transform="rotate(${15 + k * 60} ${ex.toFixed(1)} ${ey.toFixed(1)})"/>`;
      }
      const pa = -12 * Math.PI / 180, px = 100 + 46 * Math.sin(pa), py = 100 - 46 * Math.cos(pa);
      s += `<line x1="100" y1="100" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#8FB03C" stroke-width="2" stroke-linecap="round"/>` +
           `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.2" fill="#7FA83C"/>`;
      return s;
    },
  };

  const svgCabeza = (tipo, pal, px) =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="${px}" height="${px}">` +
    `<defs>${degradados(pal)}</defs>${CABEZAS[tipo](pal)}</svg>`;

  $('#introFlor').innerHTML = svgCabeza('tulipan', 'sol', 200);

  /* ───────────── Sprites para el canvas ───────────── */
  const CATALOGO = [
    { tipo: 'tulipan',  pal: 'sol',     peso: 4 },
    { tipo: 'tulipan',  pal: 'durazno', peso: 2 },
    { tipo: 'tulipan',  pal: 'rosa',    peso: 1 },
    { tipo: 'lirio',    pal: 'dorado',  peso: 2 },
    { tipo: 'lirio',    pal: 'crema',   peso: 1 },
  ];
  const NUCLEO_CAT = CATALOGO.findIndex((c) => c.tipo === 'tulipan' && c.pal === 'sol');
  // Escoge al azar (con pesos) una variante de color dentro de un tipo de flor
  const elegirCat = (tipo) => {
    const op = CATALOGO.map((c, i) => [c, i]).filter(([c]) => c.tipo === tipo);
    let r = Math.random() * op.reduce((t, [c]) => t + c.peso, 0);
    for (const [c, i] of op) { r -= c.peso; if (r <= 0) return i; }
    return op[0][1];
  };

  const cargarSprite = ({ tipo, pal }) => new Promise((res) => {
    const S = 256, img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = S;
      c.getContext('2d').drawImage(img, 0, 0, S, S);
      res(c);
    };
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgCabeza(tipo, pal, S));
  });

  const crearBrillo = () => {
    const S = 128, c = document.createElement('canvas');
    c.width = c.height = S;
    const x = c.getContext('2d'), g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0, 'rgba(255,214,110,.6)');
    g.addColorStop(.4, 'rgba(255,190,70,.18)');
    g.addColorStop(1, 'rgba(255,190,70,0)');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
    return c;
  };

  /* ───────────── Mensajes ───────────── */
  const tarjeta = $('#tarjeta'), contenido = $('#contenido'), pista = $('#pista');
  let temporizador;
  function mostrar(etiqueta, texto, larga = false) {
    clearTimeout(temporizador);
    if (!larga) deshacerCorazon();
    const yaVisible = tarjeta.classList.contains('visible');
    if (yaVisible) contenido.classList.add('oculto');
    temporizador = setTimeout(() => {
      $('#etiqueta').textContent = etiqueta;
      const f = $('#frase');
      f.textContent = texto;
      f.classList.toggle('larga', larga);
      tarjeta.classList.toggle('carta', larga);
      contenido.classList.remove('oculto');
      tarjeta.classList.add('visible');
    }, yaVisible && !REDUCIR ? 260 : 0);
  }
  function cerrarMensaje() {
    clearTimeout(temporizador);
    deshacerCorazon();
    tarjeta.classList.remove('visible');
  }

  // Progreso: cuántas flores ha leído y si ya abrió la carta
  let leidas = 0, TOTAL = 0, cartaLeida = false;

  let tPista, textoPista = '';
  function verPista(txt) {
    clearTimeout(tPista);
    pista.classList.remove('visible');
    tPista = setTimeout(() => {
      if (!txt) return;
      pista.textContent = txt;
      pista.classList.add('visible');
    }, 400);
  }
  function ponerPista(txt) { textoPista = txt; verPista(txt); }
  function pistaSiguiente() {
    if (cartaLeida) return '';
    if (leidas === 0) return 'Deslice para girar la galaxia · Toque una flor';
    if (leidas >= TOTAL) return 'Ya leyó todas las flores · Falta la carta del centro';
    return 'Toque la flor grande del centro para leer una carta';
  }
  function actualizarContador() {
    $('#contador').textContent = `${leidas} de ${TOTAL} mensajes`;
  }

  /* ───────────── Galaxia ───────────── */
  const cv = $('#galaxia'), ctx = cv.getContext('2d');
  const SERIF = '"Cormorant Garamond", Georgia, serif';
  let W = 0, H = 0, Rpx = 0, base = 40, fsBase = 16;
  let SPR = [], BRILLO = null;
  let estrellas = [], polvo = [], items = [];
  // En pantallas verticales se ve más "desde arriba" para aprovechar el alto
  const cam = { yaw: 0, vel: 0, tilt: innerHeight > innerWidth * 1.1 ? 1.15 : .95, zoom: 1, zoomObj: 1 };
  const AUTO = REDUCIR ? 0 : .06;
  const NUCLEO = { pulse: 0 };
  let abierto = false, tAbierto = 0;
  const visibles = [];
  const petalosFx = [];

  // Corazón de polvo dorado que se forma al abrir la carta
  const corazon = { on: false, fin: 0, t0: 0, cx: 0, cy: 0, parts: [] };
  let tAhora = 0;
  const COLORES_POLVO = ['#FFD54A', '#FFC93A', '#FFF1B0', '#FFE27A'];

  function hacerCorazon() {
    if (corazon.on && !corazon.fin) return;
    if (!tarjeta.classList.contains('visible') || !tarjeta.classList.contains('carta')) return;
    const libre = tarjeta.getBoundingClientRect().top - 92;   // espacio bajo el título
    if (libre < 110) return;                                  // pantalla muy baja
    const alto = Math.min(libre * .92, H * .36, 300);
    const esc = Math.min(alto / 29, W * .8 / 32);
    const cx = W / 2, cy = 92 + libre / 2;
    const n = Math.round(clamp(alto * 1.8, 260, 540));
    corazon.parts = Array.from({ length: n }, () => {
      const t = rnd(0, 6.2832), borde = Math.random() < .6;
      let hx = 16 * Math.pow(Math.sin(t), 3);
      let hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      if (borde) { hx += rnd(-.5, .5); hy += rnd(-.5, .5); }
      else { const k = Math.sqrt(Math.random()) * .96; hx *= k; hy = (hy + 2.5) * k - 2.5; }
      const a0 = rnd(0, 6.2832), r0 = rnd(0, 40);
      return {
        x0: W / 2 + Math.cos(a0) * r0, y0: H * .5 + Math.sin(a0) * r0,   // sale de la flor del centro
        tx: cx + hx * esc, ty: cy - (hy + 2.5) * esc,
        d: REDUCIR ? 0 : rnd(0, .9), dur: REDUCIR ? .01 : rnd(1.3, 2),
        arc: rnd(-60, 60), sz: rnd(.9, 2.4), a: rnd(.6, 1),
        c: elegir(COLORES_POLVO), f: rnd(0, 6.28), sp: rnd(1.5, 3.5),
      };
    });
    Object.assign(corazon, { on: true, fin: 0, t0: tAhora, cx, cy });
  }

  function deshacerCorazon() {
    if (corazon.on && !corazon.fin) corazon.fin = tAhora;
  }

  function dibujarCorazon(t) {
    if (!corazon.on) return;
    const tt = t - corazon.t0, fin = corazon.fin ? t - corazon.fin : 0;
    if (fin > 1.5) { corazon.on = false; corazon.fin = 0; corazon.parts = []; return; }
    const latido = 1 + .03 * Math.sin(t * 3.4);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of corazon.parts) {
      const k = clamp((tt - p.d) / p.dur, 0, 1), e = 1 - Math.pow(1 - k, 3), curva = Math.sin(k * Math.PI);
      let x = p.x0 + (p.tx - p.x0) * e + curva * p.arc;
      let y = p.y0 + (p.ty - p.y0) * e - curva * p.arc * .6;
      x = corazon.cx + (x - corazon.cx) * latido;
      y = corazon.cy + (y - corazon.cy) * latido;
      if (k >= 1) { x += Math.sin(t * p.sp + p.f) * 1.3; y += Math.cos(t * p.sp * .8 + p.f) * 1.3; }
      let a = p.a * (.6 + .4 * Math.sin(t * p.sp * 1.7 + p.f)) * Math.min(1, k * 5);
      if (fin) { a *= Math.max(0, 1 - fin / 1.4); y -= fin * 28; }
      if (a <= .01) continue;
      ctx.fillStyle = p.c;
      ctx.globalAlpha = a * .13; ctx.beginPath(); ctx.arc(x, y, p.sz * 2.3, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = a;       ctx.beginPath(); ctx.arc(x, y, p.sz, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function ajustar() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    deshacerCorazon();
    const vertical = H > W * 1.1;
    Rpx = vertical ? W * .68 : Math.min(W * .44, H * .44);
    base = clamp(Math.min(W, H) * .085, 30, 80);
    fsBase = clamp(Math.min(W, H) * (vertical ? .042 : .032), 14, 22);
    estrellas = Array.from({ length: Math.round(W * H / 9000) }, () => ({
      x: rnd(0, W), y: rnd(0, H), r: rnd(.6, 1.6), a: rnd(.25, .7), v: rnd(.6, 1.8), f: rnd(0, 6.28),
    }));
  }

  function crearPolvo() {
    const n = 520;
    polvo = Array.from({ length: n }, (_, i) => {
      const u = Math.pow(Math.random(), .8), brazo = i % 2;
      const g = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
      return {
        r: .12 + u * 1.05,
        th: brazo * Math.PI + u * 3.4 + g() * .42,
        h: g() * .05,
        w: .03 / (.25 + u),
        sz: rnd(.8, 1.9), a: rnd(.18, .55),
        c: Math.random() < .7 ? '#FFD98A' : '#FFF1CC',
      };
    });
  }

  function crearItems() {
    // Una flor por mensaje, más la flor especial. Dos de cada tres son tulipanes.
    const flores = [...MENSAJES.map((msg) => ({ msg })), { msg: ESPECIAL.texto, esp: true }];
    barajar(flores);
    flores.forEach((f, i) => { f.tipo = i % 3 === 2 ? 'lirio' : 'tulipan'; });
    TOTAL = flores.length;
    actualizarContador();

    const tipos = [...Array(flores.length).fill('f'), ...Array(PALABRAS.length).fill('p')];
    barajar(tipos);
    const palabras = barajar([...PALABRAS]);
    const N = tipos.length;
    items = tipos.map((k, i) => {
      const t = (i + .5) / N;
      const it = {
        k, r: .3 + .7 * Math.sqrt(t), th: i * 2.39996 + rnd(-.2, .2),
        h: rnd(-.06, .06), bob: rnd(0, 6.28), pulse: 0,
      };
      it.w = .045 / (it.r + .25);
      if (k === 'f') {
        const fl = flores.pop();
        it.cat = elegirCat(fl.tipo);
        it.tipo = fl.tipo;
        it.msg = fl.msg;
        it.esp = !!fl.esp;
        it.etiqueta = fl.esp ? ESPECIAL.etiqueta : NOMBRES[fl.tipo];
        it.leida = false;
        it.sz = rnd(.7, 1.1);
        it.rot = it.tipo === 'tulipan' ? rnd(-.5, .5) : rnd(0, 6.28);
        it.spin = it.tipo === 'tulipan' ? 0 : rnd(-.2, .2);
      } else {
        it.texto = palabras.pop();
        it.fs = rnd(.9, 1.2);
      }
      return it;
    });
  }

  /* ───────────── Pétalos al tocar ───────────── */
  function petalos(x, y, cols, n) {
    if (REDUCIR) return;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.283), sp = rnd(1.5, 5.5);
      petalosFx.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.2,
        r: rnd(0, 6.28), vr: rnd(-.12, .12), fl: rnd(0, 6.28),
        s: rnd(5, 10), c: elegir(cols), life: 1,
      });
    }
  }

  /* ───────────── Dibujo ───────────── */
  let tPrev = 0;
  function bucle(ms) {
    const t = ms / 1000, dt = Math.min(t - tPrev || .016, .05);
    tPrev = t; tAhora = t;

    // cámara
    if (!arr.activo) { cam.yaw += (AUTO + cam.vel) * dt; cam.vel *= Math.exp(-1.8 * dt); }
    let zEnt = .55;
    if (abierto) {
      tAbierto += dt;
      const e = REDUCIR ? 1 : Math.min(1, tAbierto / 3.4);
      zEnt = .45 + .55 * (1 - Math.pow(1 - e, 3));
      if (!REDUCIR) cam.yaw += 2.2 * Math.pow(1 - e, 2) * dt;
    }
    cam.zoom += (cam.zoomObj - cam.zoom) * Math.min(1, dt * 6);

    const Z = zEnt * cam.zoom, R = Rpx * Z;
    const cx = W / 2, cy = H * .5;
    const st = Math.sin(cam.tilt), ct = Math.cos(cam.tilt);

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    // estrellas
    ctx.fillStyle = '#FFF1CC';
    for (const s of estrellas) {
      ctx.globalAlpha = s.a * (.6 + .4 * Math.sin(t * s.v + s.f));
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    // resplandor del disco y del núcleo
    ctx.globalCompositeOperation = 'lighter';
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, Math.max(.25, st));
    let g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.15);
    g.addColorStop(0, 'rgba(255,196,80,.2)');
    g.addColorStop(.5, 'rgba(255,170,60,.06)');
    g.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.15, 0, 6.283); ctx.fill();
    ctx.restore();
    g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * .45);
    g.addColorStop(0, 'rgba(255,214,120,.5)');
    g.addColorStop(.5, 'rgba(255,180,70,.14)');
    g.addColorStop(1, 'rgba(255,180,70,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R * .45, 0, 6.283); ctx.fill();

    // polvo dorado (brazos de la galaxia)
    for (const d of polvo) {
      d.th += d.w * dt;
      const a = d.th + cam.yaw, x = d.r * Math.cos(a), z = d.r * Math.sin(a);
      const y1 = d.h * ct + z * st, z1 = z * ct - d.h * st, s = 1 / (1 - z1 * .4);
      ctx.globalAlpha = d.a * clamp(.6 + z1 * .8, .3, 1);
      ctx.fillStyle = d.c;
      const z2 = d.sz * s;
      ctx.fillRect(cx + x * s * R - z2 / 2, cy + y1 * s * R - z2 / 2, z2, z2);
    }
    ctx.globalCompositeOperation = 'source-over';

    // flores y palabras, de lejos a cerca
    const lista = [{ nucleo: true, z1: 0, x: cx, y: cy, s: 1 }];
    for (const it of items) {
      it.th += it.w * dt;
      if (it.k === 'f') it.rot += it.spin * dt;
      if (it.pulse > 0) it.pulse = Math.max(0, it.pulse - dt * 1.4);
      const a = it.th + cam.yaw, x = it.r * Math.cos(a), z = it.r * Math.sin(a);
      const h = it.h + Math.sin(t * .6 + it.bob) * .015;
      const y1 = h * ct + z * st, z1 = z * ct - h * st, s = 1 / (1 - z1 * .4);
      lista.push({ it, z1, s, x: cx + x * s * R, y: cy + y1 * s * R });
    }
    lista.sort((p, q) => p.z1 - q.z1);

    visibles.length = 0;
    for (const o of lista) {
      const a = clamp(.55 + o.z1 * .9, .4, 1);
      if (o.nucleo) {
        if (NUCLEO.pulse > 0) NUCLEO.pulse = Math.max(0, NUCLEO.pulse - dt * 1.4);
        const w = base * 3.3 * Z * (1 + .025 * Math.sin(t * 1.3) + .2 * NUCLEO.pulse);
        if (SPR[NUCLEO_CAT]) {
          ctx.globalCompositeOperation = 'lighter';
          const invita = leidas >= TOTAL && !cartaLeida;
          ctx.globalAlpha = Math.min(1, .7 + (invita ? .2 + .2 * Math.sin(t * 3) : 0));
          ctx.drawImage(BRILLO, cx - w * .95, cy - w * .95, w * 1.9, w * 1.9);
          ctx.globalCompositeOperation = 'source-over';
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(t * .6) * .05);
          ctx.globalAlpha = 1; ctx.drawImage(SPR[NUCLEO_CAT], -w / 2, -w / 2, w, w);
          ctx.restore();
        }
        visibles.push({ nucleo: true, x: cx, y: cy, r: Math.max(w * .45, 28) });
        continue;
      }
      const it = o.it;
      if (it.k === 'f') {
        const spr = SPR[it.cat];
        if (!spr) continue;
        const w = base * it.sz * o.s * Z * (1 + .3 * it.pulse);
        if (!it.leida) {
          // sin leer: con resplandor
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = a * .5;
          ctx.drawImage(BRILLO, o.x - w * 1.1, o.y - w * 1.1, w * 2.2, w * 2.2);
          ctx.globalCompositeOperation = 'source-over';
        }
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(it.rot);
        ctx.globalAlpha = a * (it.leida ? .72 : 1);
        ctx.drawImage(spr, -w / 2, -w / 2, w, w);
        ctx.restore();
        if (it.leida) {
          // leída: sin resplandor y con un anillo dorado
          ctx.globalAlpha = a * .8;
          ctx.strokeStyle = 'rgba(242,194,75,.85)'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(o.x, o.y, w * .6, 0, 6.283); ctx.stroke();
        }
        visibles.push({ it, x: o.x, y: o.y, r: Math.max(w * .55, 24) });
      } else {
        ctx.font = `italic 500 ${(fsBase * it.fs * o.s * Z).toFixed(1)}px ${SERIF}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        // halo oscuro para que se lea sobre las flores, y brillo dorado suave
        ctx.globalAlpha = a * .7;
        ctx.lineJoin = 'round'; ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(12,8,6,.85)';
        ctx.strokeText(it.texto, o.x, o.y);
        ctx.shadowColor = 'rgba(255,190,70,.55)'; ctx.shadowBlur = 10;
        ctx.globalAlpha = a * .85;
        ctx.fillStyle = '#FFEBB8';
        ctx.fillText(it.texto, o.x, o.y);
        ctx.shadowBlur = 0;
      }
    }

    dibujarCorazon(t);

    // pétalos que caen
    for (let i = petalosFx.length - 1; i >= 0; i--) {
      const p = petalosFx[i];
      p.vx *= .97; p.vy = (p.vy + .035) * .97;
      p.fl += .08; p.r += p.vr; p.life -= .004 * dt * 60;
      p.x += (p.vx + Math.sin(p.fl) * .5) * dt * 60; p.y += p.vy * dt * 60;
      if (p.life <= 0 || p.y > H + 20) { petalosFx.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.scale(1, .35 + .65 * Math.abs(Math.cos(p.fl)));
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s * .55, p.s, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(bucle);
  }

  /* ───────────── Interacción ───────────── */
  const arr = { activo: false, x: 0, y: 0, x0: 0, y0: 0, ult: 0, movido: false };

  const golpe = (x, y) => {
    for (let i = visibles.length - 1; i >= 0; i--) {
      const v = visibles[i];
      if (v.nucleo || v.it.k === 'f') {
        if (Math.hypot(x - v.x, y - v.y) <= v.r) return v;
      }
    }
    return null;
  };

  function tocar(x, y) {
    const v = golpe(x, y);
    if (!v) return cerrarMensaje();
    if (v.nucleo) {
      NUCLEO.pulse = 1;
      petalos(v.x, v.y, PALETAS.sol, 12);
      mostrar('Una carta para usted', CARTA, true);
      setTimeout(hacerCorazon, REDUCIR ? 50 : 400);   // cuando la tarjeta ya está en su sitio
      cartaLeida = true;
      ponerPista(pistaSiguiente());
      return;
    }
    const it = v.it, cat = CATALOGO[it.cat];
    it.pulse = 1;
    // Una flor ya leída se puede volver a abrir: muestra su mismo mensaje y no suma al contador
    const primera = !it.leida;
    if (primera) {
      it.leida = true;
      leidas++;
      actualizarContador();
    }
    petalos(v.x, v.y, PALETAS[cat.pal], it.esp ? 28 : primera ? 14 : 8);
    mostrar(it.etiqueta, it.msg);
    if (primera) ponerPista(pistaSiguiente());
  }

  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    Object.assign(arr, { activo: true, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, ult: performance.now(), movido: false });
  });

  cv.addEventListener('pointermove', (e) => {
    if (!arr.activo) {
      cv.style.cursor = golpe(e.clientX, e.clientY) ? 'pointer' : '';
      return;
    }
    if (!arr.movido && Math.hypot(e.clientX - arr.x0, e.clientY - arr.y0) > 6) arr.movido = true;
    if (arr.movido) {
      const dx = e.clientX - arr.x, dy = e.clientY - arr.y;
      const now = performance.now(), dt = Math.max(.008, (now - arr.ult) / 1000);
      cam.yaw += dx * .006;
      cam.tilt = clamp(cam.tilt - dy * .004, .35, 1.2);
      cam.vel = .7 * cam.vel + .3 * (dx * .006 / dt);
      arr.ult = now;
    }
    arr.x = e.clientX; arr.y = e.clientY;
  });

  const soltar = (e) => {
    if (!arr.activo) return;
    arr.activo = false;
    if (!arr.movido) tocar(e.clientX, e.clientY);
    else if (performance.now() - arr.ult > 80) cam.vel = 0;
    else cam.vel = clamp(cam.vel, -3, 3);
  };
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', () => { arr.activo = false; });

  cv.addEventListener('wheel', (e) => {
    cam.zoomObj = clamp(cam.zoomObj * (e.deltaY > 0 ? .93 : 1.07), .7, 1.6);
  }, { passive: true });

  addEventListener('resize', ajustar);

  /* ───────────── Música ───────────── */
  const btnMusica = $('#musica');
  const VOLUMEN = .6;
  let motor = null;   // { play(), pause(), sonando() }
  let fadeMusica = 0;

  const marcarBoton = (sonando) => {
    btnMusica.classList.toggle('silencio', !sonando);
    btnMusica.setAttribute('aria-pressed', String(sonando));
  };
  const sinMusica = () => { motor = null; btnMusica.hidden = true; };

  // Sube el volumen poco a poco al empezar
  function subirVolumen(poner) {
    let v = 0;
    clearInterval(fadeMusica);
    poner(0);
    fadeMusica = setInterval(() => {
      v = Math.min(VOLUMEN, v + .03);
      poner(v);
      if (v >= VOLUMEN) clearInterval(fadeMusica);
    }, 100);
  }

  // Opción 1: archivo de audio
  function motorArchivo(src) {
    const a = new Audio(src);
    a.loop = true; a.preload = 'auto'; a.volume = 0;
    a.addEventListener('error', sinMusica);   // si el archivo no existe, no hay botón
    a.addEventListener('play', () => marcarBoton(true));
    a.addEventListener('pause', () => marcarBoton(false));
    return {
      play: () => { subirVolumen((v) => { a.volume = v; }); return a.play().catch(() => marcarBoton(false)); },
      pause: () => a.pause(),
      sonando: () => !a.paused,
    };
  }

  // Opción 2: video de YouTube (solo se usa el sonido)
  function motorYoutube(idVideo) {
    let yt = null, listo = false, quiere = false;
    const arrancar = () => {
      subirVolumen((v) => { if (yt && yt.setVolume) yt.setVolume(Math.round(v * 100)); });
      yt.playVideo();
    };
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('ytplayer', {
        width: 200, height: 200, videoId: idVideo,
        playerVars: Object.assign(
          { playsinline: 1, controls: 0, disablekb: 1, rel: 0, loop: 1, playlist: idVideo },
          location.protocol.startsWith('http') ? { origin: location.origin } : {}
        ),
        events: {
          onReady: () => { listo = true; yt.setVolume(0); if (quiere) arrancar(); },
          onStateChange: (e) => {
            if (e.data === 1) marcarBoton(true);                                          // sonando
            else if (e.data === 2 || e.data === 5 || e.data === -1) marcarBoton(false);   // pausa o sin iniciar
          },
          onError: sinMusica,   // el video no se puede insertar, o no hay internet
        },
      });
    };
    const sc = document.createElement('script');
    sc.src = 'https://www.youtube.com/iframe_api';
    sc.onerror = sinMusica;
    document.head.appendChild(sc);
    return {
      play: () => { quiere = true; if (listo) arrancar(); },
      pause: () => { quiere = false; if (listo) yt.pauseVideo(); },
      sonando: () => listo && yt.getPlayerState() === 1,
    };
  }

  function prepararMusica() {
    if (MUSICA_YOUTUBE) motor = motorYoutube(MUSICA_YOUTUBE);
    else if (MUSICA) motor = motorArchivo(MUSICA);
  }

  function arrancarMusica() {
    if (!motor) return;
    btnMusica.hidden = false;
    marcarBoton(true);
    motor.play();
    // si el navegador no dejó empezar sola, el botón queda listo para activarla
    setTimeout(() => { if (motor && !motor.sonando()) marcarBoton(false); }, 4500);
  }

  btnMusica.addEventListener('click', () => {
    if (!motor) return;
    if (motor.sonando()) motor.pause(); else motor.play();
  });

  /* ───────────── Inicio ───────────── */
  function abrir() {
    if (abierto) return;
    abierto = true;
    $('#intro').classList.add('fuera');
    document.body.classList.add('abierto');
    arrancarMusica(); // debe ir dentro del toque del botón para que el navegador lo permita
    setTimeout(() => ponerPista(pistaSiguiente()), 2600);
  }
  $('#abrir').addEventListener('click', abrir);

  ajustar();
  prepararMusica();
  crearPolvo();
  crearItems();
  BRILLO = crearBrillo();
  Promise.all(CATALOGO.map(cargarSprite)).then((s) => { SPR = s; });
  requestAnimationFrame(bucle);
})();
</script>
