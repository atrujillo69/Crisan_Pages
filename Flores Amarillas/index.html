<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0708">
<meta name="description" content="Un pequeño detalle de flores amarillas, tulipanes y lirios.">
<title>Para mi doctora favorita</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --oro: #F2C24B;
    --crema: #FFF1CC;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: var(--serif);
    color: var(--crema);
    background:
      radial-gradient(ellipse 80% 70% at 50% 52%, #2b1c0c 0%, #140d09 48%, #08060a 100%);
    background-color: #08060a;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  #galaxia {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  #galaxia:active { cursor: grabbing; }

  /* ── Pantalla de inicio ── */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(43, 28, 12, .55), rgba(6, 4, 8, .92) 78%);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    transition: opacity 1.6s ease, visibility 0s 1.6s;
  }
  #intro.fuera { opacity: 0; visibility: hidden; pointer-events: none; }

  .intro-flor {
    width: clamp(110px, 26vw, 160px);
    margin-bottom: 1.3rem;
    filter: drop-shadow(0 0 24px rgba(255, 200, 60, .42));
    transition: transform 1.6s ease;
    animation: brotar 2.8s cubic-bezier(.2, .9, .3, 1.08) backwards;
  }
  #intro.fuera .intro-flor { transform: scale(1.7); }
  .intro-flor svg { display: block; width: 100%; height: auto; animation: girar 60s linear infinite; }
  @keyframes brotar { from { transform: scale(.05) rotate(-120deg); opacity: 0; } 40% { opacity: 1; } }
  @keyframes girar { to { transform: rotate(360deg); } }

  .subir { animation: subir 1.6s ease-out var(--r, 0s) backwards; }
  @keyframes subir { from { opacity: 0; transform: translateY(14px); } }

  .fecha {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--oro);
    opacity: .85;
  }

  #intro h1 {
    margin: .7rem 0 .6rem;
    max-width: 14ch;
    font-size: clamp(2.5rem, 9vw, 4.6rem);
    font-weight: 600;
    font-style: italic;
    line-height: 1.05;
    text-wrap: balance;
    background: linear-gradient(180deg, #FFF6D2 10%, #F2C24B 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 18px rgba(242, 194, 75, .25));
  }

  .sub {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-style: italic;
    opacity: .75;
  }

  #abrir {
    margin-top: 2.2rem;
    padding: .8rem 2.4rem;
    border: 1px solid rgba(242, 194, 75, .55);
    border-radius: 999px;
    background: rgba(242, 194, 75, .06);
    color: var(--crema);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .3s, box-shadow .3s, transform .3s;
  }
  #abrir:hover, #abrir:focus-visible {
    outline: none;
    background: rgba(242, 194, 75, .16);
    box-shadow: 0 0 28px rgba(242, 194, 75, .35);
    transform: translateY(-1px);
  }

  /* ── Sobre la galaxia ── */
  .titulo {
    position: fixed;
    top: clamp(.9rem, 3vh, 1.6rem);
    left: 0; right: 0;
    z-index: 5;
    text-align: center;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    font-style: italic;
    letter-spacing: .04em;
    color: rgba(255, 241, 204, .72);
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease 1.2s;
  }
  body.abierto .titulo { opacity: 1; }

  .tarjeta {
    position: fixed;
    left: 50%;
    bottom: clamp(3.6rem, 10vh, 6rem);
    z-index: 6;
    width: min(34rem, 90vw);
    padding: clamp(1rem, 2.6vw, 1.5rem) clamp(1.2rem, 3.4vw, 2rem);
    text-align: center;
    border-radius: 24px;
    background: rgba(26, 18, 11, .66);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(242, 194, 75, .25);
    box-shadow: 0 12px 44px rgba(0, 0, 0, .5);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 14px);
    transition: opacity .5s ease, transform .5s ease, visibility 0s .5s;
    pointer-events: none;
  }
  .tarjeta.visible { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }

  .contenido { transition: opacity .28s ease, transform .28s ease; }
  .contenido.oculto { opacity: 0; transform: translateY(6px); }

  .etiqueta {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--oro);
    margin-bottom: .55rem;
  }

  .frase {
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.25rem, 3.3vw, 1.8rem);
    line-height: 1.32;
  }
  .frase.larga { font-size: clamp(1.05rem, 2.7vw, 1.4rem); line-height: 1.4; }

  .pista {
    position: fixed;
    left: 0; right: 0;
    bottom: max(1rem, env(safe-area-inset-bottom));
    z-index: 5;
    padding: 0 1rem;
    text-align: center;
    font-size: clamp(.95rem, 2.4vw, 1.1rem);
    font-style: italic;
    color: rgba(255, 241, 204, .55);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .pista.visible { opacity: 1; }

  @media (max-height: 520px) {
    .pista { display: none; }
    .titulo { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .intro-flor, .intro-flor svg, .subir { animation: none; }
    .contenido, .tarjeta, #intro { transition-duration: .01s; }
  }
</style>
</head>
<body>

<canvas id="galaxia" role="img" aria-label="Galaxia de flores amarillas, tulipanes y lirios que gira lentamente"></canvas>

<div id="intro">
  <div class="intro-flor" id="introFlor" aria-hidden="true"></div>
  <p class="fecha subir" id="fecha" style="--r:.9s"></p>
  <h1 class="subir" id="tituloIntro" style="--r:1.5s"></h1>
  <p class="sub subir" id="subtitulo" style="--r:2.3s"></p>
  <button id="abrir" class="subir" style="--r:3.1s" type="button">Abrir</button>
</div>

<p class="titulo" id="titulo"></p>

<div class="tarjeta" id="tarjeta" role="status" aria-live="polite">
  <div class="contenido" id="contenido">
    <p class="etiqueta" id="etiqueta"></p>
    <p class="frase" id="frase"></p>
  </div>
</div>

<p class="pista" id="pista"></p>

<script>
(() => {
  'use strict';

  /* ═════════════ PERSONALIZAR ═════════════ */
  const TITULO    = 'Para mi doctora favorita';
  const FECHA     = '21 de septiembre';
  const SUBTITULO = 'Preparé algo pequeño para usted';

  // Carta que se abre al tocar la flor del centro
  const CARTA =
    'Doctora: gracias por su dedicación, por su paciencia y por esa forma tan suya ' +
    'de hacer que todo se sienta mejor. Este pequeño jardín es un detalle para ' +
    'agradecerle, y para recordarle lo valiosa que es. Con mucho cariño.';

  // Palabras que giran alrededor
  const PALABRAS = [
    'Mi doctora favorita', 'Gracias', 'Luz', 'Calidez', 'Vocación', 'Sonrisa', 'Ternura',
    'Alegría', 'Primavera', 'Admiración', 'Serenidad', 'Sol', 'Bondad',
  ];

  // Mensajes al tocar cada tipo de flor
  const FLORES = {
    amarilla: {
      nombre: 'Flor amarilla',
      frases: [
        'Usted tiene la costumbre de iluminar los días sin darse cuenta.',
        'Si la alegría tuviera un rostro, se parecería mucho a su sonrisa.',
        'Hay personas que son como el sol: con solo llegar, todo se ve mejor. Usted es una de ellas.',
        'Que hoy la vida le devuelva, multiplicada, toda la luz que usted regala.',
        'Ojalá cada mañana le recuerde lo valiosa que es.',
        'Donde usted está, siempre parece primavera.',
        'Cuidar a otros cansa. Que hoy alguien cuide de usted, aunque sea con una flor.',
        'Su vocación se nota en cada gesto, y eso no se aprende en ningún libro.',
      ],
    },
    tulipan: {
      nombre: 'Tulipán',
      frases: [
        'Los tulipanes anuncian la primavera. Usted, con solo llegar, hace lo mismo.',
        'Hay flores que se admiran, y hay personas, como usted, que se recuerdan.',
        'Delicadeza, fuerza y calidez: así la describiría un tulipán, si supiera hablar.',
        'Que nunca le falte quien la cuide como se cuida a una flor delicada.',
        'Con usted, hasta los días grises se pintan de color.',
        'Merece que la vida le regale cosas bonitas, y no solo en primavera.',
        'Las manos que cuidan también merecen flores.',
        'Hay quien estudia medicina, y hay quien, como usted, además sabe cuidar.',
      ],
    },
    lirio: {
      nombre: 'Lirio',
      frases: [
        'Los lirios simbolizan la elegancia, y usted la lleva con una naturalidad admirable.',
        'Su ternura es de esas que no hacen ruido, pero se sienten.',
        'Que la paz de un lirio al amanecer la acompañe hoy y siempre.',
        'Un lirio no presume su belleza, simplemente es. Igual que usted.',
        'La bondad también tiene perfume, y el suyo se nota a la distancia.',
        'Gracias por ser una persona tan especial.',
        'Ojalá cada persona que usted cuida sepa la suerte que tiene.',
        'Usted florece incluso cuando no se da cuenta, y eso la hace admirable.',
      ],
    },
  };
  /* ═════════════ FIN DE PERSONALIZAR ═════════════ */

  const REDUCIR = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const elegir = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const barajar = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  document.title = TITULO;
  $('#fecha').textContent = FECHA;
  $('#tituloIntro').textContent = TITULO;
  $('#subtitulo').textContent = SUBTITULO;
  $('#titulo').textContent = TITULO;

  /* ───────────── Colores: [base, medio, punta] ───────────── */
  const PALETAS = {
    girasol: ['#F0A000', '#FFC91F', '#FFE873'],
    sol:     ['#F4A300', '#FFCB2E', '#FFE066'],
    durazno: ['#EE6A2C', '#FF9A57', '#FFCBA0'],
    dorado:  ['#F08A00', '#FFC93A', '#FFF0A0'],
    crema:   ['#F2B44A', '#FFEFC2', '#FFFFFF'],
  };

  // Oscurece hacia un naranja tostado (no hacia negro, que ensucia el amarillo)
  const TOSTADO = [0xB8, 0x50, 0x08];
  const oscurecer = (hex, k = 0.2) =>
    '#' + hex.slice(1).match(/../g)
      .map((c, i) => Math.round(parseInt(c, 16) * (1 - k) + TOSTADO[i] * k).toString(16).padStart(2, '0'))
      .join('');

  /* ───────────── Flores en SVG ───────────── */
  const degradados = (pal) => {
    const [a, b, c] = PALETAS[pal];
    let s = '';
    for (const [suf, f] of [['', (x) => x], ['-d', oscurecer]]) {
      s += `<linearGradient id="g-${pal}${suf}" x1="0" y1="1" x2="0" y2="0">` +
           `<stop offset="0" stop-color="${f(a)}"/><stop offset=".55" stop-color="${f(b)}"/>` +
           `<stop offset="1" stop-color="${f(c)}"/></linearGradient>`;
    }
    return s + `<radialGradient id="g-centro"><stop offset="0" stop-color="#6E3610"/>` +
               `<stop offset=".65" stop-color="#A65A14"/><stop offset="1" stop-color="#D08A2A"/></radialGradient>`;
  };

  const CABEZAS = {
    // Flor amarilla, de frente: pétalos en dos capas y centro con semillas
    amarilla(p) {
      const g = `url(#g-${p})`, gd = `url(#g-${p}-d)`, N = 16;
      let s = '';
      for (let i = 0; i < N; i++) {
        s += `<ellipse cx="100" cy="60" rx="9" ry="31" fill="${gd}" transform="rotate(${(i * 360 / N + 11).toFixed(1)} 100 100)"/>`;
      }
      for (let i = 0; i < N; i++) {
        s += `<ellipse cx="100" cy="62" rx="9" ry="31" fill="${g}" stroke="rgba(120,70,10,.16)" stroke-width=".7" ` +
             `transform="rotate(${(i * 360 / N).toFixed(1)} 100 100)"/>`;
      }
      s += `<circle cx="100" cy="100" r="21" fill="url(#g-centro)"/>`;
      for (let k = 1; k <= 42; k++) {
        const r = 2.55 * Math.sqrt(k), a = k * 2.39996;
        s += `<circle cx="${(100 + r * Math.cos(a)).toFixed(1)}" cy="${(100 + r * Math.sin(a)).toFixed(1)}" r="1.25" fill="#4E2508" opacity=".45"/>`;
      }
      return s;
    },

    // Tulipán, de lado: tres pétalos formando la copa
    tulipan(p) {
      const g = `url(#g-${p})`, gd = `url(#g-${p}-d)`;
      return `<g transform="translate(100 100) scale(1.3) translate(-100 -100)">` +
             `<path d="M100 141 C 64 140, 56 100, 62 54 C 84 68, 99 100, 100 141Z" fill="${gd}"/>` +
             `<path d="M100 141 C 136 140, 144 100, 138 54 C 116 68, 101 100, 100 141Z" fill="${gd}"/>` +
             `<path d="M100 144 C 70 142, 68 96, 100 46 C 132 96, 130 142, 100 144Z" fill="${g}" stroke="rgba(120,60,10,.14)" stroke-width=".8"/>` +
             `<path d="M99 62 C 88 90, 86 118, 95 136" stroke="rgba(255,255,255,.5)" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
    },

    // Lirio: seis pétalos puntiagudos, pistilo y estambres
    lirio(p) {
      const g = `url(#g-${p})`, gd = `url(#g-${p}-d)`;
      const petalo = 'M100 100 C 82 80, 80 46, 100 16 C 120 46, 118 80, 100 100Z';
      let s = '';
      for (const [a, f] of [[0, gd], [120, gd], [240, gd], [60, g], [180, g], [300, g]]) {
        s += `<g transform="rotate(${a} 100 100)"><path d="${petalo}" fill="${f}" stroke="rgba(120,60,10,.2)" stroke-width=".8"/>` +
             `<path d="M100 94 L100 32" stroke="rgba(150,70,0,.25)" stroke-width="1.2" fill="none"/>` +
             `<circle cx="95" cy="74" r="1.6" fill="rgba(160,70,10,.35)"/>` +
             `<circle cx="104" cy="62" r="1.6" fill="rgba(160,70,10,.35)"/>` +
             `<circle cx="97" cy="50" r="1.4" fill="rgba(160,70,10,.3)"/></g>`;
      }
      s += `<circle cx="100" cy="100" r="9" fill="#C9D65A" opacity=".85"/>`;
      for (let k = 0; k < 6; k++) {
        const a = (15 + k * 60) * Math.PI / 180, L = 30 + (k % 2) * 6;
        const ex = 100 + L * Math.sin(a), ey = 100 - L * Math.cos(a);
        s += `<line x1="100" y1="100" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#D9902B" stroke-width="1.6" stroke-linecap="round"/>` +
             `<ellipse cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" rx="2.6" ry="6" fill="#A5471A" transform="rotate(${15 + k * 60} ${ex.toFixed(1)} ${ey.toFixed(1)})"/>`;
      }
      const pa = -12 * Math.PI / 180, px = 100 + 46 * Math.sin(pa), py = 100 - 46 * Math.cos(pa);
      s += `<line x1="100" y1="100" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#8FB03C" stroke-width="2" stroke-linecap="round"/>` +
           `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.2" fill="#7FA83C"/>`;
      return s;
    },
  };

  const svgCabeza = (tipo, pal, px) =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="${px}" height="${px}">` +
    `<defs>${degradados(pal)}</defs>${CABEZAS[tipo](pal)}</svg>`;

  $('#introFlor').innerHTML = svgCabeza('amarilla', 'girasol', 160);

  /* ───────────── Sprites para el canvas ───────────── */
  const CATALOGO = [
    { tipo: 'amarilla', pal: 'girasol', peso: 4 },
    { tipo: 'tulipan',  pal: 'sol',     peso: 2 },
    { tipo: 'tulipan',  pal: 'durazno', peso: 1 },
    { tipo: 'lirio',    pal: 'dorado',  peso: 2 },
    { tipo: 'lirio',    pal: 'crema',   peso: 1 },
  ];
  const PESO_TOTAL = CATALOGO.reduce((s, c) => s + c.peso, 0);
  const elegirCat = () => {
    let r = Math.random() * PESO_TOTAL;
    for (let i = 0; i < CATALOGO.length; i++) { r -= CATALOGO[i].peso; if (r <= 0) return i; }
    return 0;
  };

  const cargarSprite = ({ tipo, pal }) => new Promise((res) => {
    const S = 256, img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = S;
      c.getContext('2d').drawImage(img, 0, 0, S, S);
      res(c);
    };
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgCabeza(tipo, pal, S));
  });

  const crearBrillo = () => {
    const S = 128, c = document.createElement('canvas');
    c.width = c.height = S;
    const x = c.getContext('2d'), g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0, 'rgba(255,214,110,.6)');
    g.addColorStop(.4, 'rgba(255,190,70,.18)');
    g.addColorStop(1, 'rgba(255,190,70,0)');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
    return c;
  };

  /* ───────────── Mensajes ───────────── */
  const mazos = {};
  let ultima = '';
  function siguienteFrase(tipo) {
    let m = mazos[tipo];
    if (!m || !m.length) {
      m = mazos[tipo] = barajar([...FLORES[tipo].frases]);
      if (m[m.length - 1] === ultima) m.unshift(m.pop());
    }
    return (ultima = m.pop());
  }

  const tarjeta = $('#tarjeta'), contenido = $('#contenido'), pista = $('#pista');
  let temporizador;
  function mostrar(etiqueta, texto, larga = false) {
    clearTimeout(temporizador);
    const yaVisible = tarjeta.classList.contains('visible');
    if (yaVisible) contenido.classList.add('oculto');
    temporizador = setTimeout(() => {
      $('#etiqueta').textContent = etiqueta;
      const f = $('#frase');
      f.textContent = texto;
      f.classList.toggle('larga', larga);
      contenido.classList.remove('oculto');
      tarjeta.classList.add('visible');
    }, yaVisible && !REDUCIR ? 260 : 0);
  }
  function cerrarMensaje() {
    clearTimeout(temporizador);
    tarjeta.classList.remove('visible');
  }

  let pasoPista = 0; // 0: girar · 1: carta · 2: nada
  function ponerPista(txt) {
    pista.classList.remove('visible');
    setTimeout(() => {
      if (!txt) return;
      pista.textContent = txt;
      pista.classList.add('visible');
    }, 700);
  }

  /* ───────────── Galaxia ───────────── */
  const cv = $('#galaxia'), ctx = cv.getContext('2d');
  const SERIF = '"Cormorant Garamond", Georgia, serif';
  let W = 0, H = 0, Rpx = 0, base = 40, fsBase = 16;
  let SPR = [], BRILLO = null;
  let estrellas = [], polvo = [], items = [];
  // En pantallas verticales se ve más "desde arriba" para aprovechar el alto
  const cam = { yaw: 0, vel: 0, tilt: innerHeight > innerWidth * 1.1 ? 1.15 : .95, zoom: 1, zoomObj: 1 };
  const AUTO = REDUCIR ? 0 : .06;
  const NUCLEO = { pulse: 0, rot: 0 };
  let abierto = false, tAbierto = 0;
  const visibles = [];
  const petalosFx = [];

  function ajustar() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const vertical = H > W * 1.1;
    Rpx = vertical ? W * .68 : Math.min(W * .44, H * .44);
    base = clamp(Math.min(W, H) * .085, 30, 80);
    fsBase = clamp(Math.min(W, H) * (vertical ? .042 : .032), 14, 22);
    estrellas = Array.from({ length: Math.round(W * H / 9000) }, () => ({
      x: rnd(0, W), y: rnd(0, H), r: rnd(.6, 1.6), a: rnd(.25, .7), v: rnd(.6, 1.8), f: rnd(0, 6.28),
    }));
  }

  function crearPolvo() {
    const n = 520;
    polvo = Array.from({ length: n }, (_, i) => {
      const u = Math.pow(Math.random(), .8), brazo = i % 2;
      const g = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
      return {
        r: .12 + u * 1.05,
        th: brazo * Math.PI + u * 3.4 + g() * .42,
        h: g() * .05,
        w: .03 / (.25 + u),
        sz: rnd(.8, 1.9), a: rnd(.18, .55),
        c: Math.random() < .7 ? '#FFD98A' : '#FFF1CC',
      };
    });
  }

  function crearItems() {
    const NF = 30;
    const tipos = [...Array(NF).fill('f'), ...Array(PALABRAS.length).fill('p')];
    barajar(tipos);
    const palabras = barajar([...PALABRAS]);
    const N = tipos.length;
    items = tipos.map((k, i) => {
      const t = (i + .5) / N;
      const it = {
        k, r: .3 + .7 * Math.sqrt(t), th: i * 2.39996 + rnd(-.2, .2),
        h: rnd(-.06, .06), bob: rnd(0, 6.28), pulse: 0,
      };
      it.w = .045 / (it.r + .25);
      if (k === 'f') {
        it.cat = elegirCat();
        it.tipo = CATALOGO[it.cat].tipo;
        it.sz = rnd(.75, 1.25);
        it.rot = it.tipo === 'tulipan' ? rnd(-.5, .5) : rnd(0, 6.28);
        it.spin = it.tipo === 'tulipan' ? 0 : rnd(-.2, .2);
      } else {
        it.texto = palabras.pop();
        it.fs = rnd(.9, 1.2);
      }
      return it;
    });
  }

  /* ───────────── Pétalos al tocar ───────────── */
  function petalos(x, y, cols, n) {
    if (REDUCIR) return;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.283), sp = rnd(1.5, 5.5);
      petalosFx.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.2,
        r: rnd(0, 6.28), vr: rnd(-.12, .12), fl: rnd(0, 6.28),
        s: rnd(5, 10), c: elegir(cols), life: 1,
      });
    }
  }

  /* ───────────── Dibujo ───────────── */
  let tPrev = 0;
  function bucle(ms) {
    const t = ms / 1000, dt = Math.min(t - tPrev || .016, .05);
    tPrev = t;

    // cámara
    if (!arr.activo) { cam.yaw += (AUTO + cam.vel) * dt; cam.vel *= Math.exp(-1.8 * dt); }
    let zEnt = .55;
    if (abierto) {
      tAbierto += dt;
      const e = REDUCIR ? 1 : Math.min(1, tAbierto / 3.4);
      zEnt = .45 + .55 * (1 - Math.pow(1 - e, 3));
      if (!REDUCIR) cam.yaw += 2.2 * Math.pow(1 - e, 2) * dt;
    }
    cam.zoom += (cam.zoomObj - cam.zoom) * Math.min(1, dt * 6);

    const Z = zEnt * cam.zoom, R = Rpx * Z;
    const cx = W / 2, cy = H * .5;
    const st = Math.sin(cam.tilt), ct = Math.cos(cam.tilt);

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    // estrellas
    ctx.fillStyle = '#FFF1CC';
    for (const s of estrellas) {
      ctx.globalAlpha = s.a * (.6 + .4 * Math.sin(t * s.v + s.f));
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    // resplandor del disco y del núcleo
    ctx.globalCompositeOperation = 'lighter';
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, Math.max(.25, st));
    let g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.15);
    g.addColorStop(0, 'rgba(255,196,80,.2)');
    g.addColorStop(.5, 'rgba(255,170,60,.06)');
    g.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.15, 0, 6.283); ctx.fill();
    ctx.restore();
    g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * .45);
    g.addColorStop(0, 'rgba(255,214,120,.5)');
    g.addColorStop(.5, 'rgba(255,180,70,.14)');
    g.addColorStop(1, 'rgba(255,180,70,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R * .45, 0, 6.283); ctx.fill();

    // polvo dorado (brazos de la galaxia)
    for (const d of polvo) {
      d.th += d.w * dt;
      const a = d.th + cam.yaw, x = d.r * Math.cos(a), z = d.r * Math.sin(a);
      const y1 = d.h * ct + z * st, z1 = z * ct - d.h * st, s = 1 / (1 - z1 * .4);
      ctx.globalAlpha = d.a * clamp(.6 + z1 * .8, .3, 1);
      ctx.fillStyle = d.c;
      const z2 = d.sz * s;
      ctx.fillRect(cx + x * s * R - z2 / 2, cy + y1 * s * R - z2 / 2, z2, z2);
    }
    ctx.globalCompositeOperation = 'source-over';

    // flores y palabras, de lejos a cerca
    const lista = [{ nucleo: true, z1: 0, x: cx, y: cy, s: 1 }];
    for (const it of items) {
      it.th += it.w * dt;
      if (it.k === 'f') it.rot += it.spin * dt;
      if (it.pulse > 0) it.pulse = Math.max(0, it.pulse - dt * 1.4);
      const a = it.th + cam.yaw, x = it.r * Math.cos(a), z = it.r * Math.sin(a);
      const h = it.h + Math.sin(t * .6 + it.bob) * .015;
      const y1 = h * ct + z * st, z1 = z * ct - h * st, s = 1 / (1 - z1 * .4);
      lista.push({ it, z1, s, x: cx + x * s * R, y: cy + y1 * s * R });
    }
    lista.sort((p, q) => p.z1 - q.z1);

    visibles.length = 0;
    for (const o of lista) {
      const a = clamp(.55 + o.z1 * .9, .4, 1);
      if (o.nucleo) {
        if (NUCLEO.pulse > 0) NUCLEO.pulse = Math.max(0, NUCLEO.pulse - dt * 1.4);
        NUCLEO.rot += dt * .05;
        const w = base * 2.7 * Z * (1 + .025 * Math.sin(t * 1.3) + .2 * NUCLEO.pulse);
        if (SPR[0]) {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = .7; ctx.drawImage(BRILLO, cx - w * .95, cy - w * .95, w * 1.9, w * 1.9);
          ctx.globalCompositeOperation = 'source-over';
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(NUCLEO.rot);
          ctx.globalAlpha = 1; ctx.drawImage(SPR[0], -w / 2, -w / 2, w, w);
          ctx.restore();
        }
        visibles.push({ nucleo: true, x: cx, y: cy, r: Math.max(w * .45, 28) });
        continue;
      }
      const it = o.it;
      if (it.k === 'f') {
        const spr = SPR[it.cat];
        if (!spr) continue;
        const w = base * it.sz * o.s * Z * (1 + .3 * it.pulse);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a * .5;
        ctx.drawImage(BRILLO, o.x - w * 1.1, o.y - w * 1.1, w * 2.2, w * 2.2);
        ctx.globalCompositeOperation = 'source-over';
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(it.rot);
        ctx.globalAlpha = a;
        ctx.drawImage(spr, -w / 2, -w / 2, w, w);
        ctx.restore();
        visibles.push({ it, x: o.x, y: o.y, r: Math.max(w * .55, 24) });
      } else {
        ctx.font = `italic 500 ${(fsBase * it.fs * o.s * Z).toFixed(1)}px ${SERIF}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        // halo oscuro para que se lea sobre las flores, y brillo dorado suave
        ctx.globalAlpha = a * .7;
        ctx.lineJoin = 'round'; ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(12,8,6,.85)';
        ctx.strokeText(it.texto, o.x, o.y);
        ctx.shadowColor = 'rgba(255,190,70,.55)'; ctx.shadowBlur = 10;
        ctx.globalAlpha = a * .85;
        ctx.fillStyle = '#FFEBB8';
        ctx.fillText(it.texto, o.x, o.y);
        ctx.shadowBlur = 0;
      }
    }

    // pétalos que caen
    for (let i = petalosFx.length - 1; i >= 0; i--) {
      const p = petalosFx[i];
      p.vx *= .97; p.vy = (p.vy + .035) * .97;
      p.fl += .08; p.r += p.vr; p.life -= .004 * dt * 60;
      p.x += (p.vx + Math.sin(p.fl) * .5) * dt * 60; p.y += p.vy * dt * 60;
      if (p.life <= 0 || p.y > H + 20) { petalosFx.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.scale(1, .35 + .65 * Math.abs(Math.cos(p.fl)));
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s * .55, p.s, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(bucle);
  }

  /* ───────────── Interacción ───────────── */
  const arr = { activo: false, x: 0, y: 0, x0: 0, y0: 0, ult: 0, movido: false };

  const golpe = (x, y) => {
    for (let i = visibles.length - 1; i >= 0; i--) {
      const v = visibles[i];
      if (v.nucleo || v.it.k === 'f') {
        if (Math.hypot(x - v.x, y - v.y) <= v.r) return v;
      }
    }
    return null;
  };

  function tocar(x, y) {
    const v = golpe(x, y);
    if (!v) return cerrarMensaje();
    if (v.nucleo) {
      NUCLEO.pulse = 1;
      petalos(v.x, v.y, PALETAS.girasol, 18);
      mostrar('Una carta para usted', CARTA, true);
      if (pasoPista < 2) { pasoPista = 2; ponerPista(''); }
      return;
    }
    const it = v.it, cat = CATALOGO[it.cat];
    it.pulse = 1;
    petalos(v.x, v.y, PALETAS[cat.pal], 14);
    mostrar(FLORES[it.tipo].nombre, siguienteFrase(it.tipo));
    if (pasoPista === 0) { pasoPista = 1; ponerPista('Toque la flor grande del centro para leer una carta'); }
  }

  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    Object.assign(arr, { activo: true, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, ult: performance.now(), movido: false });
  });

  cv.addEventListener('pointermove', (e) => {
    if (!arr.activo) {
      cv.style.cursor = golpe(e.clientX, e.clientY) ? 'pointer' : '';
      return;
    }
    if (!arr.movido && Math.hypot(e.clientX - arr.x0, e.clientY - arr.y0) > 6) arr.movido = true;
    if (arr.movido) {
      const dx = e.clientX - arr.x, dy = e.clientY - arr.y;
      const now = performance.now(), dt = Math.max(.008, (now - arr.ult) / 1000);
      cam.yaw += dx * .006;
      cam.tilt = clamp(cam.tilt - dy * .004, .35, 1.2);
      cam.vel = .7 * cam.vel + .3 * (dx * .006 / dt);
      arr.ult = now;
    }
    arr.x = e.clientX; arr.y = e.clientY;
  });

  const soltar = (e) => {
    if (!arr.activo) return;
    arr.activo = false;
    if (!arr.movido) tocar(e.clientX, e.clientY);
    else if (performance.now() - arr.ult > 80) cam.vel = 0;
    else cam.vel = clamp(cam.vel, -3, 3);
  };
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', () => { arr.activo = false; });

  cv.addEventListener('wheel', (e) => {
    cam.zoomObj = clamp(cam.zoomObj * (e.deltaY > 0 ? .93 : 1.07), .7, 1.6);
  }, { passive: true });

  addEventListener('resize', ajustar);

  /* ───────────── Inicio ───────────── */
  function abrir() {
    if (abierto) return;
    abierto = true;
    $('#intro').classList.add('fuera');
    document.body.classList.add('abierto');
    setTimeout(() => ponerPista('Deslice para girar la galaxia · Toque una flor'), 2600);
  }
  $('#abrir').addEventListener('click', abrir);

  ajustar();
  crearPolvo();
  crearItems();
  BRILLO = crearBrillo();
  Promise.all(CATALOGO.map(cargarSprite)).then((s) => { SPR = s; });
  requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
