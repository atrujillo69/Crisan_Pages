<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE9B8">
<meta name="description" content="Un pequeño jardín de flores amarillas, tulipanes y lirios, con mensajes para usted.">
<title>Para usted</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #5a3b10;
    --oro: #b8780c;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: var(--serif);
    color: var(--ink);
    background:
      radial-gradient(70vmax 70vmax at 85% -15%, #FFFBE6 0%, rgba(255, 251, 230, 0) 62%),
      linear-gradient(180deg, #FFEFC4 0%, #FFE0B0 62%, #FFD3A0 100%);
    background-color: #FFE0B0;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* ── Sol ── */
  .sol {
    position: fixed;
    top: -8vmin;
    right: -6vmin;
    width: 40vmin;
    height: 40vmin;
    border-radius: 50%;
    background: radial-gradient(circle, #FFF8CF 0%, rgba(255, 232, 140, .55) 38%, rgba(255, 232, 140, 0) 70%);
    animation: brillo 7s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes brillo { from { transform: scale(.94); opacity: .8; } to { transform: scale(1.06); opacity: 1; } }

  /* ── Cabecera y mensaje ── */
  .cabecera {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(.7rem, 2vh, 1.2rem);
    padding: clamp(1rem, 4.5vh, 2.6rem) 1rem 0;
    text-align: center;
    pointer-events: none;
    animation: aparecer 1.6s ease-out both;
  }
  @keyframes aparecer { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

  .cabecera h1 {
    font-weight: 600;
    font-style: italic;
    font-size: clamp(2.2rem, 6.2vw, 3.7rem);
    line-height: 1.1;
    color: #6a440c;
    text-shadow: 0 2px 14px rgba(255, 250, 225, .9);
  }

  .tarjeta {
    max-width: min(34rem, 90vw);
    padding: clamp(1rem, 2.6vw, 1.6rem) clamp(1.2rem, 3.4vw, 2.2rem);
    border-radius: 26px;
    background: rgba(255, 251, 240, .58);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .75);
    box-shadow: 0 12px 40px rgba(184, 120, 12, .16);
  }

  .contenido { transition: opacity .3s ease, transform .3s ease; }
  .contenido.oculto { opacity: 0; transform: translateY(8px); }

  .etiqueta {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--oro);
    margin-bottom: .55rem;
  }

  .frase {
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.3rem, 3.5vw, 1.95rem);
    line-height: 1.32;
  }

  /* ── Jardín ── */
  #jardin { position: fixed; inset: 0; z-index: 2; overflow: hidden; }

  .flor {
    position: absolute;
    bottom: 0;
    transform-origin: 50% 100%;
    pointer-events: none;
    outline: none;
    animation: crecer 1.6s cubic-bezier(.2, .9, .3, 1.12) var(--d, 0s) backwards;
  }
  @keyframes crecer {
    from { transform: scale(.02); opacity: 0; }
    35%  { opacity: 1; }
  }

  .flor svg {
    display: block;
    width: 100%;
    height: 100%;
    transform-origin: 50% 100%;
    animation: mecer var(--dur, 6s) ease-in-out var(--dl, 0s) infinite alternate;
    pointer-events: none;
  }
  @keyframes mecer {
    from { transform: rotate(calc(var(--lean, 0deg) - var(--amp, 2deg))); }
    to   { transform: rotate(calc(var(--lean, 0deg) + var(--amp, 2deg))); }
  }

  .flor .tallo, .flor .hoja, .flor .cabeza { pointer-events: auto; cursor: pointer; }

  .flor .cabeza {
    transform-origin: 100px 100px;
    transform-box: view-box;
    transition: transform .35s cubic-bezier(.3, 1.4, .5, 1);
    animation: florecer 1.2s calc(var(--d, 0s) + .8s) cubic-bezier(.2, .9, .3, 1.25) backwards;
  }
  @keyframes florecer { from { transform: scale(.1) rotate(-40deg); opacity: 0; } 30% { opacity: 1; } }

  @media (hover: hover) { .flor .cabeza:hover { transform: scale(1.07); } }

  .flor:focus-visible svg { filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #d99a10); }

  /* ── Colinas y efectos ── */
  .colinas {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: clamp(70px, 13vh, 140px);
    z-index: 3;
    pointer-events: none;
  }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }

  .pista {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(.9rem, env(safe-area-inset-bottom));
    z-index: 6;
    padding: 0 1rem;
    text-align: center;
    pointer-events: none;
  }
  .pista span {
    display: inline-block;
    padding: .45rem 1.1rem;
    border-radius: 999px;
    background: rgba(255, 250, 238, .78);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(.95rem, 2.4vw, 1.12rem);
  }

  @media (max-height: 520px) {
    .cabecera h1 { font-size: 1.8rem; }
    .frase { font-size: 1.15rem; }
    .pista { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sol, .flor, .flor svg, .flor .cabeza, .cabecera { animation: none; }
    .contenido { transition: none; }
  }
</style>
</head>
<body>

<div class="sol" aria-hidden="true"></div>

<header class="cabecera">
  <h1>Para usted</h1>
  <div class="tarjeta" role="status" aria-live="polite">
    <div class="contenido" id="contenido">
      <p class="etiqueta" id="etiqueta">Bienvenida</p>
      <p class="frase" id="frase">Cada flor de este jardín guarda un mensaje para usted.</p>
    </div>
  </div>
</header>

<main id="jardin"></main>

<svg class="colinas" viewBox="0 0 1440 140" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 60 C 240 20, 480 30, 720 55 S 1200 80, 1440 40 L1440 140 L0 140 Z" fill="#A7D083"/>
  <path d="M0 95 C 300 60, 560 85, 800 90 S 1250 70, 1440 85 L1440 140 L0 140 Z" fill="#86B964"/>
</svg>

<canvas id="fx" aria-hidden="true"></canvas>

<p class="pista"><span>Toque una flor para leer su mensaje · Toque cualquier lugar para sembrar otra</span></p>

<script>
(() => {
  'use strict';

  const REDUCIR = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const elegir = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const barajar = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  /* ───────────── Mensajes ───────────── */
  const FLORES = {
    amarilla: {
      nombre: 'Flor amarilla',
      frases: [
        'Usted tiene la costumbre de iluminar los días sin darse cuenta.',
        'Si la alegría tuviera un rostro, se parecería mucho a su sonrisa.',
        'Hay personas que son como el sol: con solo llegar, todo se ve mejor. Usted es una de ellas.',
        'Que hoy la vida le devuelva, multiplicada, toda la luz que usted regala.',
        'Sus días merecen ser tan cálidos y luminosos como esta flor.',
        'Una sonrisa suya vale más que un jardín entero.',
        'Ojalá cada mañana le recuerde lo valiosa que es.',
        'Donde usted está, siempre parece primavera.',
      ],
    },
    tulipan: {
      nombre: 'Tulipán',
      frases: [
        'Los tulipanes anuncian la primavera. Usted, con solo llegar, hace lo mismo.',
        'Hay flores que se admiran, y hay personas, como usted, que se recuerdan.',
        'Si pudiera, le regalaría un campo entero de tulipanes, uno por cada motivo que hay para admirarla.',
        'Delicadeza, fuerza y calidez: así la describiría un tulipán, si supiera hablar.',
        'Que nunca le falte quien la cuide como se cuida a una flor delicada.',
        'Cada pétalo guarda un buen deseo para usted.',
        'Con usted, hasta los días grises se pintan de color.',
        'Merece que la vida le regale cosas bonitas, y no solo en primavera.',
      ],
    },
    lirio: {
      nombre: 'Lirio',
      frases: [
        'Los lirios simbolizan la elegancia, y usted la lleva con una naturalidad admirable.',
        'Su ternura es de esas que no hacen ruido, pero se sienten.',
        'Usted ilumina el ánimo de quien tiene la fortuna de conocerla.',
        'Que la paz de un lirio al amanecer la acompañe hoy y siempre.',
        'Un lirio no presume su belleza, simplemente es. Igual que usted.',
        'La bondad también tiene perfume, y el suyo se nota a la distancia.',
        'Gracias por ser una persona tan especial.',
        'Usted florece incluso cuando no se da cuenta, y eso la hace admirable.',
      ],
    },
  };

  /* ───────────── Colores ─────────────
     [base, medio, punta] de cada pétalo */
  const PALETAS = {
    girasol: ['#F0A000', '#FFC91F', '#FFE873'],
    sol:     ['#F4A300', '#FFCB2E', '#FFE066'],
    rosa:    ['#E8608C', '#FF8FB0', '#FFC2D6'],
    durazno: ['#EE6A2C', '#FF9A57', '#FFCBA0'],
    dorado:  ['#F08A00', '#FFC93A', '#FFF0A0'],
    crema:   ['#F2B44A', '#FFEFC2', '#FFFFFF'],
  };

  const paletaPara = (tipo) => {
    if (tipo === 'amarilla') return 'girasol';
    if (tipo === 'tulipan') return elegir(['sol', 'sol', 'rosa', 'durazno']);
    return elegir(['dorado', 'dorado', 'crema']);
  };

  // Oscurece hacia un naranja tostado (no hacia negro, que ensucia el amarillo)
  const TOSTADO = [0xB8, 0x50, 0x08];
  const oscurecer = (hex, k = 0.2) =>
    '#' + hex.slice(1).match(/../g)
      .map((c, i) => Math.round(parseInt(c, 16) * (1 - k) + TOSTADO[i] * k).toString(16).padStart(2, '0'))
      .join('');

  /* ───────────── Dibujo de flores (SVG) ───────────── */
  const gradientes = () => {
    let s = '';
    for (const [n, [a, b, c]] of Object.entries(PALETAS)) {
      for (const [suf, f] of [['', (x) => x], ['-d', oscurecer]]) {
        s += `<linearGradient id="g-${n}${suf}" x1="0" y1="1" x2="0" y2="0">` +
             `<stop offset="0" stop-color="${f(a)}"/><stop offset=".55" stop-color="${f(b)}"/>` +
             `<stop offset="1" stop-color="${f(c)}"/></linearGradient>`;
      }
    }
    s += `<radialGradient id="g-centro"><stop offset="0" stop-color="#6E3610"/>` +
         `<stop offset=".65" stop-color="#A65A14"/><stop offset="1" stop-color="#D08A2A"/></radialGradient>`;
    s += `<linearGradient id="g-hoja" x1="0" y1="1" x2="1" y2="0">` +
         `<stop offset="0" stop-color="#4C8E3D"/><stop offset="1" stop-color="#86C167"/></linearGradient>`;
    return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${s}</defs></svg>`;
  };

  // Hoja en forma de lente, de (x,y) a (x+dx,y+dy); w = grosor
  const hoja = (x, y, dx, dy, w) => {
    const mx = x + dx / 2, my = y + dy / 2, len = Math.hypot(dx, dy);
    const nx = (-dy / len) * w, ny = (dx / len) * w;
    return `<path class="hoja" fill="url(#g-hoja)" d="M${x} ${y} Q${(mx + nx).toFixed(1)} ${(my + ny).toFixed(1)} ` +
           `${x + dx} ${y + dy} Q${(mx - nx).toFixed(1)} ${(my - ny).toFixed(1)} ${x} ${y}Z"/>`;
  };

  const TALLO = 'M100 125 C 93 210, 108 320, 100 430';
  const tallo =
    `<path class="tallo" d="${TALLO}" fill="none" stroke="#5B9A47" stroke-width="5" stroke-linecap="round"/>` +
    `<path class="tallo" d="${TALLO}" fill="none" stroke="rgba(0,0,0,0)" stroke-width="26"/>`;

  const HOJAS = {
    amarilla: () => hoja(100, 335, -74, -30, 34) + hoja(100, 285, 76, -34, 34),
    tulipan:  () => hoja(100, 425, -54, -180, 30) + hoja(100, 425, 58, -160, 30),
    lirio:    () => hoja(100, 345, -64, -44, 14) + hoja(100, 305, 66, -40, 14) +
                    hoja(100, 262, -58, -38, 13) + hoja(100, 228, 52, -34, 12),
  };

  const CABEZAS = {
    // Flor amarilla, de frente: pétalos en dos capas y centro con semillas
    amarilla(p) {
      const g = `url(#g-${p})`, gd = `url(#g-${p}-d)`, N = 16;
      let s = '';
      for (let i = 0; i < N; i++) {
        s += `<ellipse cx="100" cy="60" rx="9" ry="31" fill="${gd}" transform="rotate(${(i * 360 / N + 11).toFixed(1)} 100 100)"/>`;
      }
      for (let i = 0; i < N; i++) {
        s += `<ellipse cx="100" cy="62" rx="9" ry="31" fill="${g}" stroke="rgba(120,70,10,.16)" stroke-width=".7" ` +
             `transform="rotate(${(i * 360 / N).toFixed(1)} 100 100)"/>`;
      }
      s += `<circle cx="100" cy="100" r="21" fill="url(#g-centro)"/>`;
      for (let k = 1; k <= 42; k++) {
        const r = 2.55 * Math.sqrt(k), a = k * 2.39996;
        s += `<circle cx="${(100 + r * Math.cos(a)).toFixed(1)}" cy="${(100 + r * Math.sin(a)).toFixed(1)}" r="1.25" fill="#4E2508" opacity=".45"/>`;
      }
      return s;
    },

    // Tulipán, de lado: tres pétalos formando la copa
    tulipan(p) {
      const g = `url(#g-${p})`, gd = `url(#g-${p}-d)`;
      return `<g transform="translate(100 100) scale(1.3) translate(-100 -100)">` +
             `<path d="M100 141 C 64 140, 56 100, 62 54 C 84 68, 99 100, 100 141Z" fill="${gd}"/>` +
             `<path d="M100 141 C 136 140, 144 100, 138 54 C 116 68, 101 100, 100 141Z" fill="${gd}"/>` +
             `<path d="M100 144 C 70 142, 68 96, 100 46 C 132 96, 130 142, 100 144Z" fill="${g}" stroke="rgba(120,60,10,.14)" stroke-width=".8"/>` +
             `<path d="M99 62 C 88 90, 86 118, 95 136" stroke="rgba(255,255,255,.5)" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
    },

    // Lirio: seis pétalos puntiagudos, pistilo y estambres
    lirio(p) {
      const g = `url(#g-${p})`, gd = `url(#g-${p}-d)`;
      const petalo = 'M100 100 C 82 80, 80 46, 100 16 C 120 46, 118 80, 100 100Z';
      const vena = 'M100 94 L100 32';
      let s = '';
      for (const [a, f] of [[0, gd], [120, gd], [240, gd], [60, g], [180, g], [300, g]]) {
        s += `<g transform="rotate(${a} 100 100)"><path d="${petalo}" fill="${f}" stroke="rgba(120,60,10,.2)" stroke-width=".8"/>` +
             `<path d="${vena}" stroke="rgba(150,70,0,.25)" stroke-width="1.2" fill="none"/>` +
             `<circle cx="${(100 - 5).toFixed(1)}" cy="74" r="1.6" fill="rgba(160,70,10,.35)"/>` +
             `<circle cx="${(100 + 4).toFixed(1)}" cy="62" r="1.6" fill="rgba(160,70,10,.35)"/>` +
             `<circle cx="${(100 - 3).toFixed(1)}" cy="50" r="1.4" fill="rgba(160,70,10,.3)"/></g>`;
      }
      s += `<circle cx="100" cy="100" r="9" fill="#C9D65A" opacity=".85"/>`;
      for (let k = 0; k < 6; k++) {
        const a = (15 + k * 60) * Math.PI / 180, L = 30 + (k % 2) * 6;
        const ex = 100 + L * Math.sin(a), ey = 100 - L * Math.cos(a);
        s += `<line x1="100" y1="100" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#D9902B" stroke-width="1.6" stroke-linecap="round"/>` +
             `<ellipse cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" rx="2.6" ry="6" fill="#A5471A" transform="rotate(${(15 + k * 60)} ${ex.toFixed(1)} ${ey.toFixed(1)})"/>`;
      }
      const pa = -12 * Math.PI / 180, px = 100 + 46 * Math.sin(pa), py = 100 - 46 * Math.cos(pa);
      s += `<line x1="100" y1="100" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#8FB03C" stroke-width="2" stroke-linecap="round"/>` +
           `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.2" fill="#7FA83C"/>`;
      return s;
    },
  };

  const svgFlor = (tipo, pal) =>
    `<svg viewBox="0 0 200 420" aria-hidden="true" focusable="false">` +
    `${HOJAS[tipo]()}${tallo}` +
    `<g class="cabeza">${CABEZAS[tipo](pal)}<circle class="toque" cx="100" cy="100" r="72" fill="rgba(0,0,0,0)"/></g></svg>`;

  /* ───────────── Jardín ───────────── */
  const jardin = $('#jardin');
  const plantas = [];
  const MAX_FLORES = 28;
  const CABEZA_Y = 100 / 420; // posición de la cabeza dentro del dibujo

  document.body.insertAdjacentHTML('afterbegin', gradientes());

  // Coloca la flor para que su cabeza quede en (xr, yr), en fracción de pantalla
  function colocar(el) {
    const vw = innerWidth, vh = innerHeight;
    const ideal = (vh - el._yr * vh) / (1 - CABEZA_Y);
    const h = Math.max(180, Math.min(ideal, vh * 0.92, 720));
    const w = h * 200 / 420;
    el.style.height = h + 'px';
    el.style.width = w + 'px';
    el.style.left = (el._xr * vw - w / 2) + 'px';
    el.style.zIndex = Math.round(el._yr * 1000);
  }

  function retirar(el) {
    if (REDUCIR) return el.remove();
    el.style.pointerEvents = 'none';
    el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, fill: 'forwards' }).onfinish = () => el.remove();
  }

  function plantar(xr, yr, tipo, retraso = 0) {
    tipo = tipo || elegir(Object.keys(FLORES));
    const pal = paletaPara(tipo);
    const el = document.createElement('div');
    el.className = 'flor';
    el.dataset.tipo = tipo;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', `${FLORES[tipo].nombre}: leer mensaje`);
    el.style.cssText =
      `--d:${retraso.toFixed(2)}s;--lean:${rnd(-3, 3).toFixed(1)}deg;--amp:${rnd(1.2, 2.8).toFixed(1)}deg;` +
      `--dur:${rnd(4.5, 7.5).toFixed(1)}s;--dl:${rnd(-6, 0).toFixed(1)}s`;
    el.innerHTML = svgFlor(tipo, pal);
    el._pal = pal;
    el._xr = xr;
    el._yr = yr;
    jardin.appendChild(el);
    plantas.push(el);
    colocar(el);
    if (plantas.length > MAX_FLORES) retirar(plantas.shift());
    return el;
  }

  function sembrarInicial() {
    const orden = ['amarilla', 'tulipan', 'lirio'];
    const n = Math.max(5, Math.min(12, Math.round(innerWidth / 130)));
    const inicio = Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const xr = Math.min(.94, Math.max(.06, (i + .5) / n + rnd(-.25, .25) / n));
      plantar(xr, rnd(.54, .76), orden[(i + inicio) % 3], .15 + i * .16 + rnd(0, .1));
    }
  }

  /* ───────────── Mensajes al tocar ───────────── */
  const mazos = {};
  let ultima = '';
  function siguienteFrase(tipo) {
    let m = mazos[tipo];
    if (!m || !m.length) {
      m = mazos[tipo] = barajar([...FLORES[tipo].frases]);
      if (m[m.length - 1] === ultima) m.unshift(m.pop());
    }
    return (ultima = m.pop());
  }

  const contenido = $('#contenido');
  let temporizador;
  function mostrar(tipo) {
    clearTimeout(temporizador);
    contenido.classList.add('oculto');
    temporizador = setTimeout(() => {
      $('#etiqueta').textContent = FLORES[tipo].nombre;
      $('#frase').textContent = siguienteFrase(tipo);
      contenido.classList.remove('oculto');
    }, REDUCIR ? 0 : 280);
  }

  function revelar(el) {
    const cab = el.querySelector('.cabeza');
    if (!REDUCIR) {
      cab.animate(
        [{ transform: 'scale(1) rotate(0)' }, { transform: 'scale(1.22) rotate(7deg)' },
         { transform: 'scale(.96) rotate(-3deg)' }, { transform: 'scale(1) rotate(0)' }],
        { duration: 800, easing: 'ease-out' }
      );
      const r = cab.querySelector('.toque').getBoundingClientRect();
      petalos(r.left + r.width / 2, r.top + r.height / 2, PALETAS[el._pal], 16);
    }
    mostrar(el.dataset.tipo);
  }

  document.addEventListener('click', (e) => {
    const flor = e.target.closest && e.target.closest('.flor');
    if (flor) return revelar(flor);
    const xr = e.clientX / innerWidth, yr = e.clientY / innerHeight;
    plantar(xr, yr);
    petalos(e.clientX, e.clientY, ['#FFD93B', '#FFE873', '#FFF3B0'], 6);
  });

  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('flor')) {
      e.preventDefault();
      revelar(e.target);
    }
  });

  /* ───────────── Efectos: polen y pétalos ───────────── */
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, motas = [];
  const petalosFx = [];
  const puntero = { x: -999, y: -999 };

  function crearMotas() {
    const n = REDUCIR ? 0 : Math.max(18, Math.min(60, Math.round(W * H / 26000)));
    motas = Array.from({ length: n }, () => ({
      x: rnd(0, W), y: rnd(0, H), r: rnd(1.2, 3.2), v: rnd(.12, .4),
      f: rnd(0, 6.28), a: rnd(.35, .8), vx: 0, vy: 0,
    }));
  }

  function ajustar() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    crearMotas();
    plantas.forEach(colocar);
  }

  function petalos(x, y, cols, n) {
    if (REDUCIR) return;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.283), sp = rnd(1.5, 5.5);
      petalosFx.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.2,
        r: rnd(0, 6.28), vr: rnd(-.12, .12), fl: rnd(0, 6.28),
        s: rnd(5, 10), c: elegir(cols), life: 1,
      });
    }
  }

  let ultimo = 0;
  function bucle(t) {
    const dt = Math.min((t - ultimo) / 16.67 || 1, 3);
    ultimo = t;
    ctx.clearRect(0, 0, W, H);

    for (const m of motas) {
      m.f += .01 * dt;
      m.vx *= .95; m.vy *= .95;
      const dx = m.x - puntero.x, dy = m.y - puntero.y, d2 = dx * dx + dy * dy;
      if (d2 < 14400) {
        const d = Math.sqrt(d2) || 1, fz = (120 - d) / 120 * .18;
        m.vx += dx / d * fz; m.vy += dy / d * fz;
      }
      m.x += (Math.sin(m.f) * .3 + m.vx) * dt;
      m.y += (-m.v + m.vy) * dt;
      if (m.y < -10) { m.y = H + 10; m.x = rnd(0, W); }
      if (m.x < -10) m.x = W + 10; else if (m.x > W + 10) m.x = -10;
      ctx.globalAlpha = m.a * .18; ctx.fillStyle = '#FFD54A';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 3, 0, 6.283); ctx.fill();
      ctx.globalAlpha = m.a; ctx.fillStyle = '#FFF3B0';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
    }

    for (let i = petalosFx.length - 1; i >= 0; i--) {
      const p = petalosFx[i];
      p.vx *= .97; p.vy = (p.vy + .035) * .97;
      p.fl += .08; p.r += p.vr; p.life -= .004 * dt;
      p.x += (p.vx + Math.sin(p.fl) * .5) * dt; p.y += p.vy * dt;
      if (p.life <= 0 || p.y > H + 20) { petalosFx.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.scale(1, .35 + .65 * Math.abs(Math.cos(p.fl)));
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s * .55, p.s, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(bucle);
  }

  addEventListener('pointermove', (e) => { puntero.x = e.clientX; puntero.y = e.clientY; });
  const soltar = () => { puntero.x = puntero.y = -999; };
  addEventListener('pointerup', (e) => { if (e.pointerType === 'touch') soltar(); });
  addEventListener('pointercancel', soltar);
  document.documentElement.addEventListener('pointerleave', soltar);

  let pendiente = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(pendiente);
    pendiente = requestAnimationFrame(ajustar);
  });

  ajustar();
  sembrarInicial();
  requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
